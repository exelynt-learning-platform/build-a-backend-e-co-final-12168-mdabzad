spring.application.name=ecommerce-backend
spring.datasource.url=jdbc:h2:mem:ecomdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console - Disabled in production-ready setup for security
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
# Sensitive credentials must be provided via environment variables in production
ecommerce.app.jwtSecret=${JWT_SECRET}
ecommerce.app.jwtExpirationMs=86400000

# Stripe Configuration
# Sensitive credentials must be provided via environment variables in production
stripe.api.key=${STRIPE_API_KEY}
